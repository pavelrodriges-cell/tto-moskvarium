<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТТО Москвариум</title>
<style>
:root{--bg:#03131b;--panel:#08242e;--panel2:#0b2e39;--line:#173c47;--text:#f5fafb;--muted:#8ca6af;--cyan:#35d6d8;--orange:#ff9518;--green:#48d18b;--red:#ff6470}
*{box-sizing:border-box}html,body{margin:0;background:#020b10;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}
#app{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#06252f 0,#03131b 48%,#020d13 100%)}
.screen{min-height:100vh;padding-bottom:92px}.top{display:flex;align-items:center;gap:10px;padding:17px 18px}.pad{padding:0 18px 18px}.grow{flex:1}
h1{font-size:28px;line-height:1.05;margin:10px 0 18px}h2{font-size:20px;margin:4px 0}.muted{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer}.icon{border:0;background:#0b2b36;color:#eafafb;border-radius:13px;width:42px;height:42px}.btn{border:0;background:var(--orange);color:#fff;font-weight:800;border-radius:13px;padding:12px 15px}.secondary{background:#0c3642;color:var(--cyan)}
.hero{padding:8px 18px 18px}.heroCard{padding:20px;border-radius:24px;background:linear-gradient(135deg,#0b3a47,#08242e 62%,#11333b);border:1px solid #ffffff0b;box-shadow:0 16px 40px #0003}.heroTitle{font-size:24px;font-weight:850}.heroText{color:#b4c8cd;font-size:13px;line-height:1.45;margin-top:7px}
.sectionHead{display:flex;align-items:center;gap:10px;margin:19px 0 10px}.sectionHead b{font-size:18px}
.card{background:rgba(8,36,46,.94);border:1px solid #ffffff08;border-radius:18px;padding:15px;margin:9px 0}.row{display:flex;align-items:center;gap:12px}.folder{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:#103e49;font-size:24px}
.stat{display:flex;gap:8px;margin-top:13px}.stat div{flex:1;background:#092c36;border-radius:12px;padding:10px}.stat strong{display:block;font-size:18px}.stat span{color:var(--muted);font-size:10px}
.badge{font-size:11px;color:var(--muted);margin-top:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:5px}
.priority{font-size:10px;padding:5px 8px;border-radius:8px;background:#3c2810;color:#ffb052}.green{color:var(--green)}.red{color:var(--red)}
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#061a23;border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:var(--muted);padding:7px;border-radius:12px}.nav .on{background:#0b2c37;color:var(--cyan)}.nav small{display:block;font-size:10px;margin-top:2px}
.tabs{display:flex;gap:3px;padding:4px 12px;overflow:auto}.tabs button{white-space:nowrap;background:none;border:0;color:var(--muted);padding:11px 13px}.tabs .on{color:var(--orange);font-weight:800;border-bottom:2px solid var(--orange)}
.bubble{max-width:86%;background:#092832;border-radius:17px;padding:12px 13px;margin:10px 0}.mine{margin-left:auto;background:#0c4653}.name{color:var(--cyan);font-size:12px;font-weight:800}.meta{font-size:10px;color:var(--muted);margin-top:8px}.reply{border-left:3px solid var(--orange);background:#0b3540;padding:7px 9px;border-radius:7px;margin:8px 0;font-size:11px;color:#b7c9cd}
.input{width:100%;background:#0a252f;color:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;outline:none}
.composer{position:fixed;z-index:30;bottom:64px;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#061a23;padding:8px;display:flex;gap:7px}
.progress{height:6px;background:#17343e;border-radius:8px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--orange)}
.file{display:flex;align-items:center;gap:12px}.fileIcon{width:44px;height:44px;border-radius:12px;background:#113842;display:grid;place-items:center;font-size:20px}
.login{min-height:100vh;display:grid;place-items:center;padding:25px;text-align:center;background:radial-gradient(circle at 50% 13%,#0e5361,#03131b 60%)}.logo{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(140deg,var(--cyan),var(--orange));font-size:40px}.login h1{margin-bottom:7px}.login input{margin:6px 0}.link{background:none;border:0;color:var(--cyan);padding:6px}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
"use strict";
var state={page:"home",group:"Команда Москвариума",tab:"chat"};
var groups=[
 ["Команда Москвариума","12","4","🌊"],
 ["Отдел маркетинга","8","2","🌿"],
 ["Проект «Океан»","15","7","🐋"],
 ["Технический отдел","10","3","⚙️"]
];
function go(p){state.page=p;render()}
function tab(t){state.tab=t;render()}
function nav(){return '<div class="nav"><button class="'+(state.page==="home"?"on":"")+'" onclick="go(\'home\')">⌂<small>Главная</small></button><button class="'+(state.page==="notice"?"on":"")+'" onclick="go(\'notice\')">♧<small>Уведомления</small></button><button class="'+(state.page==="profile"?"on":"")+'" onclick="go(\'profile\')">◯<small>Профиль</small></button></div>'}
function login(){return '<div class="login"><div style="width:100%;max-width:390px"><div class="logo">💧</div><h1>ТТО МОСКВАРИУМ</h1><p class="muted">Общение. Задачи. Файлы.<br>Всё в одном месте.</p><div style="margin-top:28px"><input class="input" placeholder="Email"><input class="input" type="password" placeholder="Пароль"><button class="link">Забыли пароль?</button><button class="btn" style="width:100%;margin-top:12px" onclick="go(\'home\')">Войти</button><p class="muted" style="margin-top:18px">Доступ в систему — по приглашению</p></div></div></div>'}
function home(){
 var cards=groups.map(function(g){return '<div class="card" onclick="state.group=\''+g[0]+'\';go(\'group\')"><div class="row"><div class="folder">'+g[3]+'</div><div class="grow"><b>'+g[0]+'</b><div class="badge">'+g[1]+' участников</div><div class="badge"><span class="dot"></span>'+g[2]+' активные задачи</div></div><span>›</span></div></div>'}).join("");
 return '<div class="screen"><div class="top"><b>ТТО МОСКВАРИУМ</b><span class="grow"></span><button class="icon" onclick="go(\'notice\')">♧</button><button class="icon" onclick="go(\'profile\')">◯</button></div><div class="hero"><div class="heroCard"><div class="heroTitle">Добро пожаловать 👋</div><div class="heroText">Все ваши команды, задачи и документы — в одном закрытом пространстве.</div><div class="stat"><div><strong>4</strong><span>ГРУППЫ</span></div><div><strong>14</strong><span>ЗАДАЧ</span></div><div><strong>3</strong><span>ДЕДЛАЙНА</span></div></div></div></div><div class="pad"><div class="sectionHead"><b>Мои группы</b><span class="grow"></span><span class="muted">Все</span></div>'+cards+'</div></div>'+nav()
}
function group(){
 var body=state.tab==="chat"?chat():state.tab==="tasks"?tasks():state.tab==="files"?files():members();
 return '<div class="screen"><div class="top"><button class="icon" onclick="go(\'home\')">‹</button><div class="grow"><b>'+state.group+'</b><div class="muted">12 участников</div></div><button class="icon" onclick="alert(\'Поиск будет подключён к сообщениям, задачам и файлам\')">⌕</button><button class="icon">⋯</button></div><div class="tabs"><button class="'+(state.tab==="chat"?"on":"")+'" onclick="tab(\'chat\')">Чат</button><button class="'+(state.tab==="tasks"?"on":"")+'" onclick="tab(\'tasks\')">Задачи</button><button class="'+(state.tab==="files"?"on":"")+'" onclick="tab(\'files\')">Файлы</button><button class="'+(state.tab==="members"?"on":"")+'" onclick="tab(\'members\')">Участники</button></div>'+body+'</div>'
}
function chat(){return '<div class="pad" style="padding-bottom:75px"><div class="muted" style="text-align:center;margin:10px">Сегодня</div><div class="bubble"><div class="name">Иван Петров</div>Коллеги, презентация готова.<div class="card" style="margin:9px 0 0">📄 <b>Презентация_итоговая.pdf</b><div class="badge">4.6 MB</div></div><div class="meta">❤️ 3&nbsp;&nbsp; 👍 2 <span style="float:right">10:42</span></div></div><div class="bubble"><div class="name">Мария Иванова</div><div class="reply">Иван Петров: Презентация готова.</div>Отлично! Добавь, пожалуйста, слайды по новому проекту.<div class="meta">10:45</div></div><div class="bubble mine"><div class="name">Вы</div>Хорошо, сделаю сегодня до конца дня.<div class="meta">👍 1 <span style="float:right">10:47</span></div></div></div><div class="composer"><button class="icon">＋</button><input class="input" style="margin:0" placeholder="Написать сообщение..."><button class="icon">🎙</button></div>'}
function tasks(){var a=[["Подготовить презентацию","Иван Петров, Мария Иванова","30 августа","Высокий",50,"1 / 2"],["Подготовить отчёт","Сергей Смирнов","28 августа","Средний",0,"0 / 1"],["Согласовать план мероприятия","Анна Кузнецова, Иван Петров","5 сентября","Низкий",50,"1 / 2"],["Организовать встречу","Вы","22 августа","Выполнено",100,"1 / 1"]];return '<div class="pad"><div class="row"><div class="grow"><h2>Задачи</h2><div class="muted">Выполнена только после отметки всех</div></div><button class="btn" onclick="alert(\'Форма создания задачи\')">＋</button></div>'+a.map(function(x){return '<div class="card"><div class="row"><span class="dot" style="background:'+(x[4]===100?"var(--green)":"var(--orange)")+'"></span><b class="grow">'+x[0]+'</b><span class="priority">'+x[3]+'</span></div><div class="badge">Ответственные: '+x[1]+'</div><div class="badge">◷ Срок: '+x[2]+' · '+x[5]+'</div><div class="progress"><i style="width:'+x[4]+'%;background:'+(x[4]===100?"var(--green)":"var(--orange)")+'"></i></div></div>'}).join("")+'</div>'}
function files(){var folders=[["Презентации","12 файлов","📊"],["Документы","25 файлов","📁"],["Фото","48 файлов","🖼️"],["Другое","7 файлов","📦"]];return '<div class="pad"><div class="row"><div class="grow"><h2>Файлы</h2><div class="muted">Общее хранилище группы</div></div><button class="btn" onclick="alert(\'Загрузка файла\')">＋</button></div>'+folders.map(function(x){return '<div class="card row"><div class="folder">'+x[2]+'</div><div class="grow"><b>'+x[0]+'</b><div class="badge">'+x[1]+'</div></div>›</div>'}).join("")+'<div class="sectionHead"><b>Последние файлы</b></div><div class="card file"><div class="fileIcon">📄</div><div class="grow"><b>Презентация_итоговая.pdf</b><div class="badge">4.6 MB · Иван Петров</div></div>⋮</div><div class="card file"><div class="fileIcon">📄</div><div class="grow"><b>Отчёт_июль.docx</b><div class="badge">1.2 MB · Мария Иванова</div></div>⋮</div></div>'}
function members(){var p=["Вы · Администратор","Иван Петров","Мария Иванова","Сергей Смирнов","Анна Кузнецова"];return '<div class="pad"><button class="btn" style="width:100%" onclick="alert(\'Одноразовая ссылка создана\')">🔗 Пригласить участника</button><div class="sectionHead"><b>Участники · 12</b></div>'+p.map(function(x){return '<div class="card row"><div class="avatar">◯</div><div class="grow"><b>'+x+'</b><div class="badge">'+(x.indexOf("Вы")===0?"Администратор · полный доступ":"Участник")+'</div></div><span>⋮</span></div>'}).join("")+'</div>'}
function notice(){return '<div class="screen"><div class="pad"><h1>Уведомления</h1><div class="card row"><div class="folder">✓</div><div><b>Новая задача</b><div class="muted">Иван назначил вам «Подготовить отчёт».</div></div></div><div class="card row"><div class="folder">💬</div><div><b>Новое сообщение</b><div class="muted">Мария написала в группе.</div></div></div><div class="card row"><div class="folder">◷</div><div><b>Дедлайн завтра</b><div class="muted">«Подготовить презентацию».</div></div></div><div class="card row"><div class="folder">!</div><div><b>Задача просрочена</b><div class="muted">«Отправить документы».</div></div></div></div></div>'+nav()}
function profile(){var s=["Новые сообщения","Новые задачи","Назначение задачи","Изменение статуса","Дедлайн","Новые файлы"];return '<div class="screen"><div class="pad"><h1>Профиль</h1><div class="card" style="text-align:center"><div class="avatar" style="margin:auto;width:78px;height:78px">◯</div><h2>Павел</h2><div class="muted">user@example.com</div></div><div class="sectionHead"><b>Уведомления</b></div>'+s.map(function(x){return '<div class="card row"><span class="grow">'+x+'</span><button class="icon" onclick="this.textContent=this.textContent===\'ON\'?\'OFF\':\'ON\'">ON</button></div>'}).join("")+'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="go(\'login\')">Выйти</button></div></div>'+nav()}
function render(){var r=document.getElementById("app");if(state.page==="login")r.innerHTML=login();else if(state.page==="home")r.innerHTML=home();else if(state.page==="group")r.innerHTML=group();else if(state.page==="notice")r.innerHTML=notice();else if(state.page==="profile")r.innerHTML=profile()}
window.go=go;window.tab=tab;render();
})();
</script>
</body>
</html>
