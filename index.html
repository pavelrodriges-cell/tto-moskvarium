<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТТО Москвариум</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020b10;color:#f4f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#06232d,#03131b)}
.screen{min-height:100vh;padding-bottom:82px}.pad{padding:18px}.top{display:flex;align-items:center;gap:10px;padding:16px 18px}.grow{flex:1}
h1{font-size:29px;margin:8px 0 18px}h2{margin:5px 0}.muted{color:#8da5ae;font-size:13px}
button{font:inherit;cursor:pointer}.icon{border:0;background:#0b2833;color:#e7f8fa;padding:10px 13px;border-radius:12px}.btn{border:0;border-radius:13px;padding:13px 16px;background:#ff9418;color:#fff;font-weight:800}.btn.secondary{background:#0d3540;color:#31d4d8}
.card{background:#09212b;border:1px solid #ffffff08;border-radius:17px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;gap:12px}
.folder,.avatar{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#123c48;font-size:25px}.avatar{border-radius:50%}
.badge{color:#8da5ae;font-size:12px;margin-top:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff9418;margin-right:5px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#061a23;border-top:1px solid #16333d;padding:7px 6px;z-index:20}.nav button{flex:1;background:none;border:0;color:#8da5ae;padding:8px;border-radius:11px}.nav .on{color:#31d4d8;background:#0b2934}.nav small{display:block;margin-top:2px}
.tabs{display:flex;overflow:auto;padding:4px 10px}.tabs button{background:none;border:0;color:#8da5ae;padding:10px 12px}.tabs .on{color:#ff9418;border-bottom:2px solid #ff9418;font-weight:800}
.bubble{max-width:86%;background:#09212b;border-radius:16px;padding:12px;margin:10px 0}.mine{margin-left:auto;background:#0c4250}.name{color:#31d4d8;font-weight:800;font-size:12px}.meta{color:#8da5ae;font-size:10px;margin-top:7px}
input{width:100%;padding:14px;border-radius:13px;border:1px solid #163944;background:#0a222d;color:white;margin:6px 0;outline:none}.login{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 15%,#0d4d5d,#03131b 60%)}.logo{width:88px;height:88px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(140deg,#31d4d8,#ff9418);font-size:40px}.progress{height:6px;background:#16333e;border-radius:8px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;background:#ff9418}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
(function(){
'use strict';

var state={page:'login',groupTab:'chat'};

var groups=[
 {name:'Команда Москвариума',members:'12 участников',tasks:'4 активные задачи',icon:'🌊'},
 {name:'Отдел маркетинга',members:'8 участников',tasks:'2 активные задачи',icon:'🌿'},
 {name:'Проект «Океан»',members:'15 участников',tasks:'7 активных задач',icon:'🐋'},
 {name:'Технический отдел',members:'10 участников',tasks:'3 активные задачи',icon:'⚙️'}
];

function app(){return document.getElementById('app');}
function go(page){state.page=page;render();}
function groupTab(name){state.groupTab=name;render();}

function nav(){
 return '<div class="nav">'
 +' <button class="'+(state.page==='home'?'on':'')+'" onclick="go(\\'home\\')">⌂<small>Главная</small></button>'
 +' <button class="'+(state.page==='notice'?'on':'')+'" onclick="go(\\'notice\\')">♧<small>Уведомления</small></button>'
 +' <button class="'+(state.page==='profile'?'on':'')+'" onclick="go(\\'profile\\')">◯<small>Профиль</small></button>'
 +'</div>';
}

function login(){
 return '<div class="login"><div style="width:100%;max-width:410px">'
 +'<div class="logo">💧</div><h1>ТТО МОСКВАРИУМ</h1>'
 +'<p class="muted">Общение. Задачи. Файлы.<br>Всё в одном месте.</p>'
 +'<div style="margin-top:30px">'
 +'<input placeholder="Email"><input type="password" placeholder="Пароль">'
 +'<button style="background:none;border:0;color:#31d4d8">Забыли пароль?</button>'
 +'<button class="btn" style="width:100%;margin-top:15px" onclick="go(\\'home\\')">Войти</button>'
 +'<p class="muted">Нет аккаунта?</p><button style="background:none;border:0;color:#31d4d8">Доступ по приглашению</button>'
 +'</div></div></div>';
}

function home(){
 var cards=groups.map(function(g){
  return '<div class="card" onclick="go(\\'group\\')"><div class="row">'
   +'<div class="folder">'+g.icon+'</div><div class="grow"><b>'+g.name+'</b>'
   +'<div class="muted">'+g.members+'</div><div class="badge"><span class="dot"></span>'+g.tasks+'</div>'
   +'</div><span>›</span></div></div>';
 }).join('');
 return '<div class="screen"><div class="top"><b>ТТО МОСКВАРИУМ</b><span class="grow"></span>'
  +'<button class="icon" onclick="go(\\'notice\\')">♧</button><button class="icon" onclick="go(\\'profile\\')">◯</button></div>'
  +'<div class="pad"><h1>Мои группы</h1>'+cards+'</div></div>'+nav();
}

function group(){
 var body=state.groupTab==='chat'?chat():state.groupTab==='tasks'?tasks():state.groupTab==='files'?files():members();
 return '<div class="screen"><div class="top"><button class="icon" onclick="go(\\'home\\')">‹</button>'
  +'<div><b>Команда Москвариума</b><div class="muted">12 участников</div></div><span class="grow"></span>'
  +'<button class="icon" onclick="alert(\\'Поиск по разделу\\')">⌕</button></div>'
  +'<div class="tabs">'
  +'<button class="'+(state.groupTab==='chat'?'on':'')+'" onclick="groupTab(\\'chat\\')">Чат</button>'
  +'<button class="'+(state.groupTab==='tasks'?'on':'')+'" onclick="groupTab(\\'tasks\\')">Задачи</button>'
  +'<button class="'+(state.groupTab==='files'?'on':'')+'" onclick="groupTab(\\'files\\')">Файлы</button>'
  +'<button class="'+(state.groupTab==='members'?'on':'')+'" onclick="groupTab(\\'members\\')">Участники</button>'
  +'</div>'+body+'</div>';
}

function chat(){
 return '<div class="pad">'
 +'<div class="bubble"><div class="name">Иван Петров</div>Коллеги, презентация готова.<div class="card">📄 Презентация_итоговая.pdf</div><div class="meta">❤️ 3 &nbsp; 👍 2 · 10:42</div></div>'
 +'<div class="bubble"><div class="name">Мария Иванова</div>Отлично! Добавь слайды по новому проекту.<div class="meta">10:45</div></div>'
 +'<div class="bubble mine"><div class="name">Вы</div>Хорошо, сделаю сегодня до конца дня.<div class="meta">10:47</div></div>'
 +'</div>';
}

function tasks(){
 var t=[
 ['Подготовить презентацию','Иван Петров, Мария Иванова','30 августа','Высокий','1 / 2',50],
 ['Подготовить отчёт','Сергей Смирнов','28 августа','Средний','0 / 1',0],
 ['Согласовать план','Анна Кузнецова, Иван Петров','5 сентября','Низкий','1 / 2',50],
 ['Организовать встречу','Вы','22 августа','Выполнено','1 / 1',100]
 ];
 var html='<div class="pad"><div class="row"><h2 class="grow">Задачи</h2><button class="btn" onclick="alert(\\'Здесь будет создание задачи\\')">＋ Новая</button></div>';
 t.forEach(function(x){html+='<div class="card"><div class="row"><span class="dot"></span><b class="grow">'+x[0]+'</b>'+(x[5]===100?'✓':'')+'</div><div class="muted">'+x[1]+'</div><div class="badge">◷ '+x[2]+' · '+x[3]+' · '+x[4]+'</div><div class="progress"><i style="width:'+x[5]+'%"></i></div></div>';});
 return html+'</div>';
}

function files(){
 return '<div class="pad"><div class="row"><h2 class="grow">Файлы</h2><button class="btn" onclick="alert(\\'Загрузка файла\\')">＋</button></div>'
 +[['Презентации','12 файлов'],['Документы','25 файлов'],['Фото','48 файлов'],['Другое','7 файлов']].map(function(x){return '<div class="card row"><div class="folder">📁</div><div class="grow"><b>'+x[0]+'</b><div class="muted">'+x[1]+'</div></div>›</div>';}).join('')
 +'<div class="card">📄 <b>Презентация_итоговая.pdf</b><div class="muted">4.6 MB · Иван Петров</div></div>'
 +'<div class="card">📄 <b>Отчёт_июль.docx</b><div class="muted">1.2 MB · Мария Иванова</div></div></div>';
}

function members(){
 var p=['Вы · Администратор','Иван Петров','Мария Иванова','Сергей Смирнов','Анна Кузнецова'];
 return '<div class="pad"><button class="btn" style="width:100%" onclick="alert(\\'Одноразовая ссылка создана\\')">🔗 Пригласить участника</button>'
 +p.map(function(x){return '<div class="card row"><div class="avatar">◯</div><div class="grow"><b>'+x+'</b><div class="muted">'+(x.indexOf('Вы')===0?'Полный доступ':'Участник')+'</div></div></div>';}).join('')+'</div>';
}

function notice(){
 var n=[['✓','Новая задача','Иван назначил вам «Подготовить отчёт».'],['💬','Новое сообщение','Мария написала в группе.'],['◷','Дедлайн завтра','«Подготовить презентацию».'],['!','Задача просрочена','«Отправить документы».']];
 return '<div class="screen"><div class="pad"><h1>Уведомления</h1>'+n.map(function(x){return '<div class="card row"><div class="folder">'+x[0]+'</div><div><b>'+x[1]+'</b><div class="muted">'+x[2]+'</div></div></div>';}).join('')+'</div></div>'+nav();
}

function profile(){
 var s=['Новые сообщения','Новые задачи','Назначение задачи','Изменение статуса','Дедлайн','Новые файлы'];
 return '<div class="screen"><div class="pad"><h1>Профиль</h1><div class="card" style="text-align:center"><div class="avatar" style="margin:auto;width:80px;height:80px">◯</div><h2>Павел</h2><div class="muted">user@example.com</div></div><h3>Уведомления</h3>'
 +s.map(function(x){return '<div class="card row"><span class="grow">'+x+'</span><button class="icon">ON</button></div>';}).join('')
 +'<button class="btn secondary" style="width:100%" onclick="go(\\'login\\')">Выйти</button></div></div>'+nav();
}

function render(){
 try{
  if(state.page==='login') app().innerHTML=login();
  else if(state.page==='home') app().innerHTML=home();
  else if(state.page==='group') app().innerHTML=group();
  else if(state.page==='notice') app().innerHTML=notice();
  else if(state.page==='profile') app().innerHTML=profile();
 }catch(e){
  app().innerHTML='<div style="padding:30px;color:#ff7b85"><h2>Ошибка прототипа</h2><pre style="white-space:pre-wrap">'+e.message+'</pre></div>';
 }
}
window.go=go;window.groupTab=groupTab;render();
})();
</script>
</body>
</html>
