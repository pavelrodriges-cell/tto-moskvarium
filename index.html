<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТТО Москвариум</title><style>
*{box-sizing:border-box}body{margin:0;background:#020b10;color:#f5fafb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#app{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(#06252f,#03131b 65%,#020d13)}.screen{min-height:100vh;padding-bottom:85px}.top{display:flex;align-items:center;gap:10px;padding:16px 18px}.pad{padding:0 18px 18px}.grow{flex:1}h1{font-size:28px;margin:10px 0 18px}h2{font-size:20px}.muted,.badge{color:#8ea7af;font-size:13px}.badge{font-size:11px;margin-top:5px}button,input,textarea,select{font:inherit}button{cursor:pointer}.icon{border:0;background:#0b2b36;color:#fff;border-radius:12px;width:42px;height:42px}.btn{border:0;background:#ff9518;color:#fff;font-weight:800;border-radius:13px;padding:12px 15px}.card{background:#09252f;border:1px solid #ffffff08;border-radius:18px;padding:15px;margin:9px 0}.row{display:flex;align-items:center;gap:10px}.priority{font-size:10px;padding:5px 8px;border-radius:8px}.high{background:#42240e;color:#ffb052}.mid{background:#3b3210;color:#ffd45c}.low{background:#103a35;color:#48d18b}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#ff9518}.green{background:#48d18b}.progress{height:7px;background:#173640;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#ff9518}.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.person{font-size:11px;background:#10353f;padding:7px 9px;border-radius:10px}.person.done{color:#48d18b;border:1px solid #48d18b33}.stat{display:flex;gap:8px;margin-top:13px}.stat div{flex:1;background:#092c36;border-radius:12px;padding:10px}.stat strong{display:block;font-size:18px}.stat span{color:#8ea7af;font-size:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#061a23;border-top:1px solid #1a424c;padding:7px}.nav button{flex:1;background:none;border:0;color:#8ea7af;padding:7px;border-radius:12px}.nav .on{background:#0b2c37;color:#35d6d8}.nav small{display:block;font-size:10px}.tabs{display:flex;overflow:auto;padding:3px 12px}.tabs button{background:none;border:0;color:#8ea7af;padding:11px 13px}.tabs .on{color:#ff9518;font-weight:800;border-bottom:2px solid #ff9518}.status{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:7px 10px;background:#17333b;font-size:11px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}.sheet{width:min(480px,100%);max-height:92vh;overflow:auto;background:#061b24;border-radius:24px 24px 0 0;padding:18px}.sheetHead{display:flex;align-items:center;margin-bottom:10px}.close{border:0;background:#102d36;color:#fff;border-radius:10px;padding:8px 12px}.detailTitle{font-size:23px;font-weight:850}label{display:block;color:#b7c9ce;font-size:12px;margin:13px 0 6px}input,textarea,select{width:100%;background:#08232d;border:1px solid #1a424c;color:#fff;border-radius:12px;padding:12px}textarea{min-height:90px}.check{display:flex;align-items:center;gap:8px;background:#092a34;padding:9px;border-radius:10px;margin:6px 0;font-size:13px}.check input{width:auto}</style></head><body><div id="app"></div><script>
const people=["Иван Петров","Мария Иванова","Сергей Смирнов","Анна Кузнецова","Павел"];
let tasks=[{id:1,title:"Подготовить презентацию",desc:"Обновить слайды по новому проекту и подготовить финальную версию.",due:"30 августа",priority:"Высокий",people:[["Иван Петров",1],["Мария Иванова",1],["Сергей Смирнов",0]],comment:"Финальную версию отправить в общий чат."},{id:2,title:"Подготовить отчёт",desc:"Собрать данные за месяц и оформить итоговый отчёт.",due:"28 августа",priority:"Средний",people:[["Сергей Смирнов",0]],comment:""},{id:3,title:"Согласовать план мероприятия",desc:"Проверить программу и согласовать финальный план.",due:"5 сентября",priority:"Низкий",people:[["Анна Кузнецова",1],["Иван Петров",0]],comment:""},{id:4,title:"Организовать встречу",desc:"Согласовать время и отправить приглашения.",due:"22 августа",priority:"Высокий",people:[["Павел",1]],comment:"Встреча проведена."}];
let page="home",tab="tasks",modal=null,current=null;
function go(p){page=p;modal=null;render()}function st(t){let d=t.people.filter(x=>x[1]).length;return d===0?"Новая":d===t.people.length?"Выполнена":"В работе"}function pc(p){return p==="Высокий"?"high":p==="Средний"?"mid":"low"}function nav(){return '<div class="nav"><button class="'+(page==="home"?"on":"")+'" onclick="go('home')">⌂<small>Главная</small></button><button class="'+(page==="group"?"on":"")+'" onclick="go('group')">▣<small>Группа</small></button><button class="'+(page==="profile"?"on":"")+'" onclick="go('profile')">◯<small>Профиль</small></button></div>'}
function home(){return '<div class="screen"><div class="top"><b>ТТО МОСКВАРИУМ</b><span class="grow"></span><button class="icon" onclick="go('profile')">◯</button></div><div class="pad"><h1>Мои группы</h1><div class="card" onclick="go('group')"><div class="row"><b style="font-size:28px">🌊</b><div class="grow"><b>Команда Москвариума</b><div class="badge">12 участников · 4 активные задачи</div></div>›</div></div><div class="card"><div class="row"><b style="font-size:28px">🌿</b><div class="grow"><b>Отдел маркетинга</b><div class="badge">8 участников · 2 активные задачи</div></div>›</div></div></div></div>'+nav()}
function group(){return '<div class="screen"><div class="top"><button class="icon" onclick="go('home')">‹</button><div class="grow"><b>Команда Москвариума</b><div class="muted">12 участников</div></div><button class="icon">⌕</button></div><div class="tabs"><button class="'+(tab==="chat"?"on":"")+'" onclick="tab='chat';render()">Чат</button><button class="'+(tab==="tasks"?"on":"")+'" onclick="tab='tasks';render()">Задачи</button><button class="'+(tab==="files"?"on":"")+'" onclick="tab='files';render()">Файлы</button><button class="'+(tab==="members"?"on":"")+'" onclick="tab='members';render()">Участники</button></div>'+(tab==="tasks"?taskList():'<div style="padding:40px;text-align:center;color:#8ea7af">Раздел пока в следующем этапе.<br><br><button class="btn" onclick="tab='tasks';render()">Открыть задачи</button></div>')+'</div>'+nav()}
function taskList(){let active=tasks.filter(t=>st(t)!=="Выполнена").length,done=tasks.length-active;return '<div class="pad"><div class="card"><div class="row"><div class="grow"><b>Контроль выполнения</b><div class="badge">Сводка по всем задачам группы</div></div><button class="btn" onclick="modal='new';render()">＋ Задача</button></div><div class="stat"><div><strong>'+active+'</strong><span>АКТИВНЫЕ</span></div><div><strong>'+done+'</strong><span>ВЫПОЛНЕНО</span></div><div><strong>1</strong><span>ПРОСРОЧЕНЫ</span></div></div></div><div class="row" style="margin-top:18px"><h2 class="grow">Все задачи</h2><span class="muted">'+tasks.length+'</span></div>'+tasks.map(t=>{let d=t.people.filter(x=>x[1]).length;return '<div class="card" onclick="openTask('+t.id+')"><div class="row"><div class="grow"><b>'+t.title+'</b><div class="badge">◷ '+t.due+' · '+d+' / '+t.people.length+' выполнено</div></div><span class="priority '+pc(t.priority)+'">'+t.priority+'</span></div><div class="people">'+t.people.map(x=>'<span class="person '+(x[1]?"done":"")+'">'+(x[1]?"✓ ":"⏳ ")+x[0]+'</span>').join("")+'</div><div class="progress"><i style="width:'+(d/t.people.length*100)+'%;background:'+(d===t.people.length?"#48d18b":"#ff9518")+'"></i></div><div style="margin-top:10px"><span class="status"><span class="dot '+(d===t.people.length?"green":"")+'"></span>'+st(t)+'</span></div></div>'}).join("")+'</div>'}
function openTask(id){current=tasks.find(t=>t.id===id);modal="task";render()}function togglePerson(id,i){let t=tasks.find(x=>x.id===id);t.people[i][1]=!t.people[i][1];current=t;render()}
function taskModal(t){let d=t.people.filter(x=>x[1]).length;return '<div class="modal"><div class="sheet"><div class="sheetHead"><b>Задача</b><span class="grow"></span><button class="close" onclick="modal=null;render()">Закрыть</button></div><div class="detailTitle">'+t.title+'</div><div style="margin-top:10px"><span class="status"><span class="dot '+(d===t.people.length?"green":"")+'"></span>'+st(t)+'</span> <span class="priority '+pc(t.priority)+'">'+t.priority+'</span></div><div class="card"><div class="muted">Описание</div><div style="margin-top:7px">'+(t.desc||"—")+'</div></div><div class="card"><div class="row"><b class="grow">Ответственные</b><span>'+d+' / '+t.people.length+'</span></div>'+t.people.map((x,i)=>'<label class="check"><input type="checkbox" '+(x[1]?"checked":"")+' onchange="togglePerson('+t.id+','+i+')"><span class="grow">'+x[0]+'</span><span style="color:'+(x[1]?"#48d18b":"#8ea7af")+'">'+(x[1]?"Выполнено":"Не выполнено")+'</span></label>').join("")+'</div><div class="card"><b>Срок</b><div class="badge">📅 '+t.due+'</div><div class="progress"><i style="width:'+(d/t.people.length*100)+'%;background:'+(d===t.people.length?"#48d18b":"#ff9518")+'"></i></div><div class="badge">Прогресс: '+d+' из '+t.people.length+'</div></div><div class="card"><b>Комментарий</b><div class="badge">'+(t.comment||"Нет комментария")+'</div></div><button class="btn" style="width:100%" onclick="modal=null;render()">Готово</button></div></div>'}
function newModal(){return '<div class="modal"><div class="sheet"><div class="sheetHead"><b>Новая задача</b><span class="grow"></span><button class="close" onclick="modal=null;render()">Закрыть</button></div><label>Название</label><input id="nt" placeholder="Например: Подготовить презентацию"><label>Описание</label><textarea id="nd" placeholder="Что нужно сделать"></textarea><label>Ответственные</label>'+people.map((p,i)=>'<label class="check"><input type="checkbox" id="p'+i+'"> '+p+'</label>').join("")+'<label>Срок</label><input id="due" type="date"><label>Приоритет</label><select id="pri"><option>Высокий</option><option selected>Средний</option><option>Низкий</option></select><label>Комментарий</label><textarea id="nc"></textarea><button class="btn" style="width:100%;margin-top:15px" onclick="createTask()">Создать задачу</button></div></div>'}
function createTask(){let title=document.getElementById("nt").value.trim();if(!title)return alert("Введите название задачи");let ps=people.filter((p,i)=>document.getElementById("p"+i).checked).map(n=>[n,0]);if(!ps.length)return alert("Выберите ответственных");let raw=document.getElementById("due").value;tasks.unshift({id:Date.now(),title,desc:document.getElementById("nd").value,due:raw?new Date(raw+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"}):"Не указан",priority:document.getElementById("pri").value,people:ps,comment:document.getElementById("nc").value});modal=null;render()}
function profile(){return '<div class="screen"><div class="pad"><h1>Профиль</h1><div class="card" style="text-align:center"><div style="font-size:42px">◯</div><h2>Павел</h2><div class="muted">user@example.com</div></div><div class="card"><b>Уведомления</b>'+["Новые сообщения","Новые задачи","Назначение задачи","Изменение статуса","Дедлайн","Новые файлы"].map(x=>'<label class="check">'+x+'<span class="grow"></span><input type="checkbox" checked></label>').join("")+'</div></div></div>'+nav()}
function render(){let r=document.getElementById("app");r.innerHTML=page==="home"?home():page==="group"?group():profile();if(modal==="task")r.insertAdjacentHTML("beforeend",taskModal(current));if(modal==="new")r.insertAdjacentHTML("beforeend",newModal())}
render();
</script></body></html>
