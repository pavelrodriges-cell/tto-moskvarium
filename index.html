<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТТО Москвариум v0.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020b10;color:#f5fafb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#app{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(#06252f,#03131b 65%,#020d13)}.screen{min-height:100vh;padding-bottom:90px}.top{display:flex;align-items:center;gap:10px;padding:16px 18px}.pad{padding:0 18px 18px}.grow{flex:1}h1{font-size:28px;margin:10px 0 18px}h2{font-size:20px}.muted,.badge{color:#8ea7af;font-size:13px}.badge{font-size:11px;margin-top:5px}button,input{font:inherit}button{cursor:pointer}.icon{border:0;background:#0b2b36;color:#fff;border-radius:12px;width:42px;height:42px}.btn{border:0;background:#ff9518;color:#fff;font-weight:800;border-radius:13px;padding:11px 15px}.card{background:#09252f;border:1px solid #ffffff08;border-radius:18px;padding:15px;margin:9px 0}.row{display:flex;align-items:center;gap:10px}.tabs{display:flex;overflow:auto;padding:3px 12px;border-bottom:1px solid #143842}.tabs button{background:none;border:0;color:#8ea7af;padding:11px 13px}.tabs .on{color:#ff9518;font-weight:800;border-bottom:2px solid #ff9518}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#061a23;border-top:1px solid #1a424c;padding:7px}.nav button{flex:1;background:none;border:0;color:#8ea7af;padding:7px;border-radius:12px}.nav .on{background:#0b2c37;color:#35d6d8}.nav small{display:block;font-size:10px}.messages{padding:8px 14px 100px}.msg{display:flex;gap:8px;margin:12px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:50%;background:#12414b;display:grid;place-items:center;flex:none;font-size:12px}.bubble{max-width:78%;background:#0a2d37;border-radius:15px 15px 15px 5px;padding:10px 12px}.me .bubble{background:#16404a;border-radius:15px 15px 5px 15px}.name{font-size:11px;color:#35d6d8;margin-bottom:4px}.time{font-size:9px;color:#78939b;margin-top:5px;text-align:right}.reply{border-left:3px solid #ff9518;padding:5px 8px;margin-bottom:7px;background:#08232c;color:#9eb2b8;font-size:11px;border-radius:5px}.reaction{display:inline-block;margin-top:5px;background:#09242c;border:1px solid #25505a;border-radius:10px;padding:3px 6px;font-size:11px}.composer{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#061a23;border-top:1px solid #1a424c;padding:8px;display:flex;gap:6px}.composer input{min-width:0;flex:1;background:#082730;border:1px solid #1a424c;color:#fff;border-radius:13px;padding:11px}.mini{border:0;background:#0b2b36;color:#dcebed;border-radius:11px;width:40px}.attach{display:none}.search{display:flex;gap:8px;padding:8px 14px}.search input{flex:1;background:#082730;border:1px solid #1a424c;color:#fff;border-radius:12px;padding:10px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}.sheet{width:min(480px,100%);background:#061b24;border-radius:24px 24px 0 0;padding:18px}.sheet button{margin-top:8px}
</style></head><body><div id="app"></div><script>
let page="home",tab="chat",editing=null,replyTo=null,search="";
let messages=[
{id:1,user:"Иван Петров",me:false,text:"Коллеги, напоминаю: презентацию нужно подготовить до 30 августа.",time:"18:21",reaction:"👍",reply:null},
{id:2,user:"Мария Иванова",me:false,text:"Принято. Я обновлю блок по проекту.",time:"18:24",reaction:"❤️",reply:1},
{id:3,user:"Павел",me:true,text:"Отлично. Если нужна помощь — пишите.",time:"18:27",reaction:"",reply:null}
];
function nav(){return `<div class="nav"><button class="${page==="home"?"on":""}" onclick="go('home')">⌂<small>Главная</small></button><button class="${page==="group"?"on":""}" onclick="go('group')">▣<small>Группа</small></button><button class="${page==="profile"?"on":""}" onclick="go('profile')">◯<small>Профиль</small></button></div>`}
function go(p){page=p;render()}
function group(){return `<div class="screen"><div class="top"><button class="icon" onclick="go('home')">‹</button><div class="grow"><b>Команда Москвариума</b><div class="muted">12 участников</div></div><button class="icon" onclick="focusSearch()">⌕</button></div><div class="tabs"><button class="${tab==="chat"?"on":""}" onclick="tab='chat';render()">Чат</button><button onclick="tab='tasks';render()">Задачи</button><button onclick="tab='files';render()">Файлы</button><button onclick="tab='members';render()">Участники</button></div>${tab==="chat"?chat():`<div style="padding:45px;text-align:center;color:#8ea7af">Раздел «${tab==="tasks"?"Задачи":tab==="files"?"Файлы":"Участники"}»<br><br><button class="btn" onclick="tab='chat';render()">Вернуться в чат</button></div>`}</div>${nav()}`}
function chat(){let arr=messages.filter(m=>!search||m.text.toLowerCase().includes(search.toLowerCase())||m.user.toLowerCase().includes(search.toLowerCase()));return `<div class="search"><input id="search" value="${search}" placeholder="Поиск по сообщениям" oninput="search=this.value;render();setTimeout(focusSearch,0)"></div><div class="messages"><div class="muted" style="padding:4px 2px 8px">Нажмите на сообщение: ответить · изменить · удалить · реакция.</div>${arr.map(m=>msg(m)).join("")}</div><div class="composer"><input id="fileInput" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" multiple style="display:none" onchange="attachFiles(event)"><button class="mini" onclick="document.getElementById('fileInput').click()">＋</button><button class="mini" id="voiceBtn" onclick="toggleVoice()">🎙</button><input id="text" placeholder="${editing?'Редактирование сообщения':'Сообщение...'}" value="${editing?editing.text:''}" onkeydown="if(event.key==='Enter')send()"><button class="mini" onclick="send()">➤</button></div>`}
function msg(m){let rep=m.reply?messages.find(x=>x.id===m.reply):null;return `<div class="msg ${m.me?'me':''}">${m.me?'':`<div class="avatar">${m.user[0]}</div>`}<div class="bubble" onclick="menu(${m.id})" oncontextmenu="event.preventDefault();menu(${m.id})">${m.me?'':'<div class="name">'+m.user+'</div>'}${rep?`<div class="reply">↩ ${rep.user}: ${rep.text.slice(0,55)}</div>`:''}<div>${m.text}</div>${m.audio?`<audio controls src="${m.audio}" style="width:100%;margin-top:7px"></audio>`:''}${m.reaction?`<span class="reaction">${m.reaction}</span>`:''}<div class="time">${m.time} ${m.me?'✓✓':''}</div></div></div>`}
function send(){let el=document.getElementById("text"),v=el&&el.value.trim();if(!v)return;if(editing){editing.text=v;editing=null}else messages.push({id:Date.now(),user:"Павел",me:true,text:v,time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),reaction:"",reply:replyTo});replyTo=null;render()}
function menu(id){
  const m=messages.find(x=>x.id===id); if(!m)return;
  const actions=m.me?["reply","edit","delete","react","cancel"]:["reply","react","cancel"];
  const labels={reply:"↩ Ответить",edit:"✏️ Редактировать",delete:"🗑️ Удалить",react:"👍 Реакция",cancel:"Отмена"};
  const choice=prompt("Выберите действие:\n\n"+actions.map((a,i)=>(i+1)+". "+labels[a]).join("\n"));
  const n=parseInt(choice,10); if(!n||n>actions.length)return;
  const action=actions[n-1];
  if(action==="reply"){replyTo=id;render();setTimeout(()=>document.getElementById("text")?.focus(),0)}
  if(action==="edit"){editing=m;render();setTimeout(()=>document.getElementById("text")?.focus(),0)}
  if(action==="delete"&&confirm("Удалить это сообщение?")){messages=messages.filter(x=>x.id!==id);render()}
  if(action==="react"){m.reaction=m.reaction==="👍"?"":"👍";render()}
}
function attachFiles(e){
  [...e.target.files].forEach(file=>{
    const kind=file.type.startsWith("image/")?"📷 Фото: ":file.type.startsWith("video/")?"🎥 Видео: ":"📎 Файл: ";
    messages.push({id:Date.now()+Math.random(),user:"Павел",me:true,text:kind+file.name,time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),reaction:"",reply:null});
  });
  e.target.value=""; render();
}
let mediaRecorder=null,voiceChunks=[],recording=false,voiceStream=null;
async function toggleVoice(){
  const btn=document.getElementById("voiceBtn");
  if(recording){mediaRecorder.stop();recording=false;if(btn)btn.textContent="🎙";return}
  if(!navigator.mediaDevices?.getUserMedia){alert("Браузер не поддерживает запись с микрофона.");return}
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    voiceChunks=[]; mediaRecorder=new MediaRecorder(voiceStream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      messages.push({id:Date.now(),user:"Павел",me:true,text:"🎙️ Голосовое сообщение",audio:URL.createObjectURL(blob),time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),reaction:"",reply:null});
      voiceStream?.getTracks().forEach(t=>t.stop()); render();
    };
    mediaRecorder.start(); recording=true; if(btn)btn.textContent="⏹";
  }catch(e){alert("Не удалось получить доступ к микрофону. Разрешите микрофон для сайта и попробуйте снова.")}
}
function focusSearch(){document.getElementById("search")?.focus()}
function home(){return `<div class="screen"><div class="top"><b>ТТО МОСКВАРИУМ</b><span class="grow"></span><button class="icon" onclick="go('profile')">◯</button></div><div class="pad"><h1>Мои группы</h1><div class="card" onclick="go('group')"><div class="row"><b style="font-size:28px">🌊</b><div class="grow"><b>Команда Москвариума</b><div class="badge">12 участников · новое сообщение</div></div>›</div></div><div class="card"><div class="row"><b style="font-size:28px">🌿</b><div class="grow"><b>Отдел маркетинга</b><div class="badge">8 участников · 2 активные задачи</div></div>›</div></div></div></div>${nav()}`}
function profile(){return `<div class="screen"><div class="pad"><h1>Профиль</h1><div class="card" style="text-align:center"><div style="font-size:42px">◯</div><h2>Павел</h2><div class="muted">user@example.com</div></div><div class="card"><b>Уведомления</b>${["Новые сообщения","Новые задачи","Назначение задачи","Изменение статуса","Дедлайн","Новые файлы"].map(x=>`<label style="display:flex;margin:12px 0">${x}<span class="grow"></span><input type="checkbox" checked></label>`).join("")}</div></div></div>${nav()}`}
function render(){document.getElementById("app").innerHTML=page==="home"?home():page==="group"?group():profile()}
render();
</script></body></html>
